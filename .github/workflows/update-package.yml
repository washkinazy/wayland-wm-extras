name: Update Package

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      force_update:
        type: boolean
        default: false
    secrets:
      PAT_TOKEN:
        required: true
        description: 'Fine-grained token with contents and pull requests write access'

permissions:
  contents: read

concurrency:
  group: update-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install Fedora tooling
        run: dnf install -y git gh python3-rpm python3-pyyaml rpm-build redhat-rpm-config python3-devel pyproject-rpm-macros cargo-rpm-macros systemd-rpm-macros meson curl
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Discover and apply update
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package_name }}
          FORCE: ${{ inputs.force_update }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 .github/scripts/packages.py update "$PACKAGE" "${args[@]}"
        shell: bash
      - name: Validate spec and exact sources
        if: steps.update.outputs.changed == 'true'
        env:
          PACKAGE: ${{ inputs.package_name }}
        run: |
          bash .github/scripts/validate-spec.sh "$PACKAGE" "$PACKAGE"
          bash .github/scripts/check-source.sh "$PACKAGE" "$PACKAGE"
      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PACKAGE: ${{ inputs.package_name }}
          VERSION: ${{ steps.update.outputs.version }}
          PREVIOUS: ${{ steps.update.outputs.previous }}
        run: bash .github/scripts/open-update-pr.sh
      - name: Summary
        if: success()
        env:
          CHANGED: ${{ steps.update.outputs.changed }}
          PACKAGE: ${{ inputs.package_name }}
        run: |
          if [ "$CHANGED" = true ]; then
            echo "Update PR prepared for $PACKAGE; build checks and review are required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No newer upstream revision for $PACKAGE." >> "$GITHUB_STEP_SUMMARY"
          fi
