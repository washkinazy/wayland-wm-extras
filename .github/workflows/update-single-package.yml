name: Update Single Package

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name from packages.yml (validated against inventory)'
        required: true
        type: string
      force_update:
        description: 'Rebuild unchanged revisions by incrementing Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-package:
    uses: ./.github/workflows/update-package.yml
    with:
      package_name: ${{ inputs.package_name }}
      force_update: ${{ inputs.force_update }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
