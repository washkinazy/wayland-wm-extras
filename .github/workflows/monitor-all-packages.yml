name: Monitor All Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Rebuild unchanged revisions by incrementing Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  load-config:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - run: dnf install -y git python3-rpm python3-pyyaml
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: config
        run: python3 .github/scripts/packages.py matrix
  update-packages:
    needs: load-config
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: ${{ fromJSON(needs.load-config.outputs.matrix) }}
    uses: ./.github/workflows/update-package.yml
    with:
      package_name: ${{ matrix.package.name }}
      force_update: ${{ inputs.force_update || false }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
