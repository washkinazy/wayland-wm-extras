name: Validate Packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      any: ${{ steps.changed.outputs.any }}
    steps:
      - name: Install Fedora tooling
        run: dnf install -y git just shellcheck python3-rpm python3-pyyaml rpm-build redhat-rpm-config python3-devel pyproject-rpm-macros cargo-rpm-macros systemd-rpm-macros meson curl tar gzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: just check
      - name: Lint workflows with pinned Actionlint
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$work/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $work/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$work/actionlint.tar.gz" -C "$work" actionlint
          "$work/actionlint"
      - name: Select changed packages
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$PWD"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          python3 .github/scripts/packages.py changed --base "$BASE"
  build:
    needs: checks
    if: needs.checks.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.checks.outputs.matrix) }}
        fedora: ['43', '44']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build isolated SRPM and RPMs
        env:
          PACKAGE: ${{ matrix.package }}
          FEDORA: ${{ matrix.fedora }}
        run: |
          docker run --rm --privileged -v "$PWD:/workspace" -w /workspace \
            -e PACKAGE -e FEDORA "registry.fedoraproject.org/fedora:$FEDORA" \
            bash .github/scripts/ci-build.sh
      - name: Make build logs accessible to the runner
        if: always()
        run: |
          # Docker creates root-owned mktemp directories with mode 0700.
          # Restore runner access even when the build exits unsuccessfully.
          if [ -d .build ]; then
            sudo chown -R --no-dereference -- "$(id -u):$(id -g)" .build
            sudo chmod -R u+rX -- .build
          fi
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.package }}-fedora-${{ matrix.fedora }}
          path: .build/**/result/*.log
          include-hidden-files: true
          if-no-files-found: ignore
  # Stable name for branch protection, including docs-only changes with no builds.
  required:
    name: Package checks
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          HAS_BUILDS: ${{ needs.checks.outputs.any }}
        run: |
          test "$CHECKS" = success
          if [ "$HAS_BUILDS" = true ]; then
            test "$BUILD" = success
          else
            test "$BUILD" = skipped
          fi
